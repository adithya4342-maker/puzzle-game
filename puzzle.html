<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>20-Piece Image Puzzle</title>
<style>
    body {
        font-family: sans-serif;
        text-align: center;
        background-color: #f4f4f9;
        margin: 0;
        padding: 20px;
    }
    h2 {
        color: #333;
    }
    .controls {
        margin-bottom: 20px;
        padding: 10px;
        background-color: #fff;
        border-radius: 8px;
        display: inline-block;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    #puzzle-container {
        display: grid;
        grid-template-columns: repeat(5, 100px); /* 5 columns */
        grid-template-rows: repeat(4, 100px);    /* 4 rows = 20 pieces */
        gap: 2px;
        width: max-content;
        margin: 20px auto;
        border: 4px solid #2c3e50;
        background-color: #2c3e50;
        padding: 2px;
        border-radius: 8px;
    }
    .puzzle-piece {
        width: 100px;
        height: 100px;
        background-color: #ddd; /* Default color before image uploads */
        background-size: 500px 400px; /* Scales image to fit */
        cursor: pointer;
        box-sizing: border-box;
        transition: transform 0.1s;
    }
    .puzzle-piece:hover {
        opacity: 0.8;
    }
    .selected {
        border: 4px solid #e74c3c;
        transform: scale(0.95);
        opacity: 1 !important;
    }
    .instructions {
        font-size: 16px;
        color: #555;
        margin-bottom: 10px;
    }
</style>
</head>
<body>

    <h2>Solve the 20-Piece Puzzle!</h2>
    
    <div class="controls">
        <label for="imageUpload"><strong>1. Upload your picture here: </strong></label>
        <input type="file" id="imageUpload" accept="image/*">
    </div>

    <p class="instructions"><strong>2. How to play:</strong> Click one piece to select it, then click another piece to swap them.</p>

    <div id="puzzle-container"></div>

    <script>
        const container = document.getElementById('puzzle-container');
        const imageUpload = document.getElementById('imageUpload');
        const rows = 4;
        const cols = 5;
        let pieces = [];
        let selectedPiece = null;
        let currentImageUrl = ''; // To store the uploaded image

        // Create the 20 pieces logically
        function initPuzzle() {
            pieces = [];
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    pieces.push({ id: r * cols + c, row: r, col: c });
                }
            }
            // Shuffle the pieces randomly
            pieces.sort(() => Math.random() - 0.5);
            render();
        }

        // Render the puzzle on the screen
        function render() {
            container.innerHTML = '';
            pieces.forEach((piece, index) => {
                const div = document.createElement('div');
                div.className = 'puzzle-piece';
                
                // Add the image if one is uploaded
                if (currentImageUrl) {
                    div.style.backgroundImage = `url(${currentImageUrl})`;
                    div.style.backgroundPosition = `-${piece.col * 100}px -${piece.row * 100}px`;
                }
                
                div.dataset.index = index;

                // Handle click-to-swap logic
                div.onclick = () => {
                    if (!currentImageUrl) {
                        alert("Please upload an image first!");
                        return;
                    }

                    if (selectedPiece === null) {
                        selectedPiece = div;
                        div.classList.add('selected');
                    } else {
                        const idx1 = selectedPiece.dataset.index;
                        const idx2 = div.dataset.index;
                        
                        // Swap
                        [pieces[idx1], pieces[idx2]] = [pieces[idx2], pieces[idx1]];
                        
                        selectedPiece.classList.remove('selected');
                        selectedPiece = null;
                        render();
                        checkWin();
                    }
                };
                container.appendChild(div);
            });
        }

        // Check if solved
        function checkWin() {
            let win = true;
            for (let i = 0; i < pieces.length; i++) {
                if (pieces[i].id !== i) {
                    win = false;
                    break;
                }
            }
            if (win) {
                setTimeout(() => alert("Congratulations! You solved the puzzle!"), 200);
            }
        }

        // Handle Image Upload
        imageUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    currentImageUrl = event.target.result;
                    initPuzzle(); // Restart the puzzle with the new image
                }
                reader.readAsDataURL(file);
            }
        });

        // Start empty board
        initPuzzle();
    </script>
</body>
</html>
